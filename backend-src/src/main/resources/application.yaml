spring:
  application:
    name: transcended

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: none
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
    locations: classpath:db/migration

  mail:
    host: smtp.mailgun.org
    port: 587
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false

security:
  jwt:
    secret: ${JWT_SECRET}
    expiration: 3600
  two-factor:
    email-enabled: ${TWO_FACTOR_EMAIL_ENABLED:false}
    test-code: ${TWO_FACTOR_TEST_CODE:000000}

app:
  uploads:
    posts-dir: ./transcended/uploads/posts
    avatars-dir: ./transcended/uploads/avatars

server:
  port: 8080
