components:
  schemas:
    UserDto:
      type: object
      properties:
        id:
          type: integer
          format: int64
        nickname:
          type: string
        name:
          type: string
        lastName:
          type: string
        email:
          type: string
        phone:
          type: string
        role:
          type: string
          enum:
          - ADMIN
          - USER
        postIds:
          type: array
          items:
            type: integer
            format: int64
        channelIds:
          type: array
          items:
            type: integer
            format: int64
        about:
          type: string
    ChangePasswordRequest:
      type: object
      properties:
        oldPassword:
          type: string
        newPassword:
          type: string
    ProfileRequest:
      type: object
      properties:
        displayName:
          type: string
          maxLength: 80
          minLength: 0
        bio:
          type: string
          maxLength: 500
          minLength: 0
        avatarUrl:
          type: string
        location:
          type: string
        websiteUrl:
          type: string
    ProfileDto:
      type: object
      properties:
        id:
          type: integer
          format: int64
        userId:
          type: integer
          format: int64
        displayName:
          type: string
        bio:
          type: string
        avatarUrl:
          type: string
        location:
          type: string
        websiteUrl:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    PostDto:
      type: object
      properties:
        userId:
          type: integer
          format: int64
        title:
          type: string
          minLength: 1
        content:
          type: string
          maxLength: 1024
          minLength: 0
        likes:
          type: integer
          format: int64
        dislikes:
          type: integer
          format: int64
        idComments:
          type: array
          items:
            type: integer
            format: int64
        idChannel:
          type: integer
          format: int64
        dataCreated:
          type: string
          format: date-time
        dataEdited:
          type: string
          format: date-time
        dataDeleted:
          type: string
          format: date-time
      required:
      - content
      - dataCreated
      - title
      - userId
    CommentDto:
      type: object
      properties:
        id:
          type: integer
          format: int64
        postId:
          type: integer
          format: int64
        userId:
          type: integer
          format: int64
        content:
          type: string
        dataCreated:
          type: string
          format: date-time
        dataEdited:
          type: string
          format: date-time
        dataDeleted:
          type: string
          format: date-time
    SkillDto:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
    PostAttachmentDto:
      type: object
      properties:
        id:
          type: integer
          format: int64
        postId:
          type: integer
          format: int64
        originalFileName:
          type: string
        contentType:
          type: string
        size:
          type: integer
          format: int64
        url:
          type: string
        createdAt:
          type: string
          format: date-time
    PostCreateDto:
      type: object
      properties:
        title:
          type: string
          minLength: 1
        content:
          type: string
          maxLength: 1024
          minLength: 0
      required:
      - content
      - title
    ChannelDto:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        description:
          type: string
        adminId:
          type: integer
          format: int64
        memberCount:
          type: integer
          format: int32
        postCount:
          type: integer
          format: int32
    AvatarDto:
