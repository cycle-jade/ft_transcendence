          type: string
        tokenType:
          type: string
        expiresIn:
          type: integer
          format: int64
    RegisterRequest:
      type: object
      properties:
        nickname:
          type: string
        password:
          type: string
        email:
          type: string
        name:
          type: string
        lastName:
          type: string
        phone:
          type: string
    LoginRequest:
