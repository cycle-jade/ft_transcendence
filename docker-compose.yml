# FT_transcendence — Evaluation Docker Compose
# Usage:
#   1. cp .env.example .env  (fill in credentials)
#   2. docker compose up --build

services:

  db:
    image: postgres:15-alpine
    container_name: ft_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - app-network

  backend:
    build:
      context: ./backend-src
    container_name: ft_backend
    restart: unless-stopped
    expose:
      - "8080"
    environment:
      DB_URL: ${DB_URL}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      TWO_FACTOR_EMAIL_ENABLED: ${TWO_FACTOR_EMAIL_ENABLED}
      TWO_FACTOR_TEST_CODE: ${TWO_FACTOR_TEST_CODE}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app-network

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: https://localhost/api
    container_name: ft_frontend
    restart: unless-stopped
    expose:
      - "3000"
    depends_on:
      - backend
    networks:
      - app-network

  nginx:
    build:
      context: ./nginx
    container_name: ft_nginx
    restart: unless-stopped
    ports:
      - "443:443"
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs
    command: sh -c "mkdir -p /etc/nginx/certs && [ -f /etc/nginx/certs/selfsigned.crt ] || openssl req -x509 -nodes -days 365 -newkey rsa:2048 -keyout /etc/nginx/certs/selfsigned.key -out /etc/nginx/certs/selfsigned.crt -subj /CN=localhost 2>/dev/null; exec nginx -g 'daemon off;'"
    depends_on:
      - frontend
      - backend
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  db-data:
